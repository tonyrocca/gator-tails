  if (m.img) return `<div class="meme"><img src="${esc(/^(https?:|\/)/.test(m.img) ? m.img : '/' + m.img)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.style.display='none'">${m.top ? `<div class="tx top">${esc(m.top)}</div>` : ''}${m.bottom ? `<div class="tx bot">${esc(m.bottom)}</div>` : ''}</div>${cap}`;
  return '';
};
for (const r of [...E.rankings].sort((a, b) => b.rank - a.rank)) {
  const t = T[r.team];
  const meme = [r.meme, ...(r.media || [])].map(media).join('');
  slides.push(`<div class="slide"><div class="eyebrow">${esc(E.title)} · #${r.rank} ${mv(r)}</div><div class="head"><div class="bigrank">${r.rank}</div><div><div class="n">${esc(t.name)}</div><div class="o">${esc(t.manager.nick)} · ${esc(t.manager.first)} ${esc(t.manager.last)}</div></div></div><div class="stats"><div class="st"><div class="v">${rec(t)}</div><div class="l">Record</div></div><div class="st"><div class="v">${Math.round(week ? t.record.pf : t.startPts).toLocaleString()}</div><div class="l">${week ? 'Pts YTD' : 'Proj pts'}</div></div>${week ? `<div class="st"><div class="v">${(() => { const w = (t.weekly || []).find(x => x.wk === week); return w ? w.pts.toFixed(1) : '–'; })()}</div><div class="l">Week ${week}</div></div>` : `<div class="st"><div class="v"><span class="gr ${gcls(r.grade)}" style="font-size:15px">${esc(r.grade)}</span></div><div class="l">Draft</div></div>`}</div>${r.thoughts ? `<p class="thoughts">${esc(r.thoughts)}</p>` : ''}${(r.good || r.bad) ? `<div class="gb">${r.good ? `<div class="g"><b>Expert consensus: what's working</b>${esc(r.good)}</div>` : ''}${r.bad ? `<div class="b"><b>Experts are worried about</b>${esc(r.bad)}</div>` : ''}</div>` : ''}${r.quote ? `<div class="quote">“${esc(r.quote.text)}”<div class="who">- ${esc(r.quote.who)}</div></div>` : ''}${E.slots ? slotHtml(r) : ''}${meme}${r.takeaway ? `<div class="take"><b>Expert takeaway</b>${esc(r.takeaway)}</div>` : ''}</div>`);
}
// final board + share
slides.push(`<div class="slide"><div class="eyebrow">${esc(D.computed.league)} · ${esc(E.title)}</div><h2 style="margin-top:4px">Power Rankings</h2><div class="card" style="padding:6px 8px;margin-top:10px"><table><tbody>${board.map(r => { const t = T[r.team]; return `<tr><td class="r"><span class="rk">${r.rank}</span>${mv(r)}</td><td class="t"><div class="n">${esc(t.name)}</div><div class="o">${esc(t.manager.nick)}</div></td><td class="num">${rec(t)}<small>${pts(t)}</small></td></tr>`; }).join('')}</tbody></table></div>${bump}<div class="grow"></div><button class="btn" id="share" style="margin-top:14px">SHARE THE BOARD</button><div class="foot">${esc(E.outro)}</div></div>`);

if (E.extra && E.extra.interstitial) slides.push(`<div class="slide"><div class="grow"></div><div style="display:flex;justify-content:center">${MASCOT.replace('class="gator"', 'class="gator" style="width:140px"')}</div><h1 style="text-align:center;font-size:52px;margin-top:10px">${E.extra.interstitial.map(esc).join('<br>')}</h1><div class="grow"></div><div class="hint">tap</div></div>`);
if (E.extra) { const x = E.extra; slides.push(`<div class="slide"><div class="eyebrow">${esc(x.eyebrow || 'One more thing')}</div><h2 style="margin-top:6px">${esc(x.title)}</h2>${x.body ? `<p class="thoughts">${esc(x.body)}</p>` : ''}${x.countdownTo ? `<div class="card cd" data-to="${esc(x.countdownTo)}"><div class="cdn"><span><b>--</b><i>days</i></span><span><b>--</b><i>hrs</i></span><span><b>--</b><i>min</i></span><span><b>--</b><i>sec</i></span></div><div class="cdl">${esc(x.countdownLabel || '')}</div></div>` : ''}${(x.media || []).map(media).join('')}</div>`); }
if ((D.archive || []).length) slides.push(`<div class="slide"><div class="eyebrow">Every week</div><h2 style="margin-top:6px">Rewind the rankings</h2><div class="arch">${[...D.archive].reverse().map(a => { const cur = a.id === E.id, latest = a.id === D.latest; return `<a href="${latest ? '/' : '/' + a.id + '/'}" class="${cur ? 'cur' : ''}"><span><b>${esc(a.title)}</b><i>${esc(a.date || '')}</i></span><em>${cur ? 'You are here' : latest ? 'Current' : 'Open'}</em></a>`; }).join('')}</div>${E.id !== D.latest ? `<a class="btn" href="/" style="margin-top:14px;text-align:center;text-decoration:none">Go to the current week</a>` : ''}</div>`);
const S = document.getElementById('slides'); S.innerHTML = slides.join('');
S.addEventListener('click', e => { const b = e.target.closest('.spin'); if (!b) return; const sl = b.closest('.slot'); if (sl.classList.contains('done') || sl.classList.contains('going')) return; sl.classList.add('going'); b.textContent = '...';
  sl.querySelectorAll('.strip').forEach((st, k) => { const n = st.children.length, h = st.children[0].getBoundingClientRect().height; st.style.transition = 'none'; st.style.transform = 'translateY(0)'; void st.offsetHeight; st.style.transition = `transform ${1.1 + k * .45}s cubic-bezier(.12,.75,.25,1)`; st.style.transform = `translateY(-${(n - 1) * h}px)`; });
  setTimeout(() => { sl.classList.remove('going'); sl.classList.add('done'); b.hidden = true; const f = sl.querySelector('.fate'); f.hidden = false; if (navigator.vibrate) navigator.vibrate(40); }, 2150); });
const B = document.getElementById('bars'); B.innerHTML = slides.map(() => '<b></b>').join('');
let i = 0; const all = [...S.children], barEls = [...B.children];
let ytReady = null;
const loadYT = () => ytReady || (ytReady = new Promise(res => { if (window.YT && YT.Player) return res(); window.onYouTubeIframeAPIReady = res; const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc); }));
const playYt = y => { if (y.dataset.playing) return; y.dataset.playing = '1'; const id = y.dataset.id; y.innerHTML = '<div class="ytp"></div>'; loadYT().then(() => { const p = new YT.Player(y.querySelector('.ytp'), { videoId: id, playerVars: { autoplay: 1, playsinline: 1, rel: 0, start: parseInt(y.dataset.start || 0) }, events: { onReady: e => { e.target.unMute(); e.target.setVolume(100); e.target.playVideo(); setTimeout(() => { if (e.target.getPlayerState && e.target.getPlayerState() !== 1) { e.target.mute(); e.target.playVideo(); } }, 1800); } } }); y._p = p; }); };
const stopYt = y => { try { y._p && y._p.destroy(); } catch (e) {} y._p = null; delete y.dataset.playing; y.innerHTML = `<img src="${y.dataset.thumb}" alt=""><div class="play">▶</div>`; };
function show(n) { i = Math.max(0, Math.min(slides.length - 1, n)); all.forEach((s, k) => { s.classList.toggle('on', k === i); if (k === i) { s.scrollTop = 0; s.querySelectorAll('.yt[data-autoplay]').forEach(playYt); } else { s.querySelectorAll('.yt[data-playing]').forEach(stopYt); } }); barEls.forEach((b, k) => { b.className = k < i ? 'done' : k === i ? 'cur' : ''; }); try { history.replaceState(null, '', '#' + i); } catch (e) {} }
let swiped = false, sx = 0, sy = 0;
S.addEventListener('click', e => { const y = e.target.closest('.yt'); if (y) { playYt(y); return; } if (swiped || e.target.closest('button,a,.slot')) return; const r = S.getBoundingClientRect(); show((e.clientX - r.left) < r.width * .3 ? i - 1 : i + 1); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); });
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
document.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { swiped = true; show(i + (dx < 0 ? 1 : -1)); setTimeout(() => swiped = false, 400); } });
show(parseInt(location.hash.slice(1)) || 0);
(function tick() { document.querySelectorAll('.cd').forEach(el => { const ms = new Date(el.dataset.to) - Date.now(); const b = el.querySelectorAll('b'); if (ms <= 0) { b.forEach(x => x.textContent = '00'); el.querySelector('.cdl').textContent = "TIME'S UP. DEAN IS A COWARD."; return; } const s = Math.floor(ms / 1000); const v = [Math.floor(s / 86400), Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60]; b.forEach((x, i) => x.textContent = String(v[i]).padStart(2, '0')); }); setTimeout(tick, 1000); })();

// share card
async function drawCard() {
  try { await document.fonts.load('900 60px Rubik'); await document.fonts.load('500 30px Rubik'); await document.fonts.load('700 30px Rubik'); } catch (e) {}
  const c = document.getElementById('cv'), x = c.getContext('2d'), W = c.width, H = c.height;
  x.fillStyle = '#f7f5ef'; x.fillRect(0, 0, W, H);
  // gator
  const img = new Image(); img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(MASCOT.replace('class="gator"', E.theme ? 'width="300" height="245"' : 'width="300" height="225"'));
  await new Promise(r => { img.onload = r; img.onerror = r; });
  try { x.drawImage(img, W - 360, 60, 300, 225); } catch (e) {}
  x.fillStyle = '#2f8f4e'; x.font = '700 30px Rubik, sans-serif'; x.textAlign = 'left'; x.fillText((D.computed.league + '  ·  ' + E.season).toUpperCase(), 70, 150);
  x.fillStyle = '#1d3b2a'; x.font = '900 96px Rubik, sans-serif'; x.fillText(E.title, 70, 250); x.fillText('Power Rankings', 70, 350);
  x.fillStyle = '#6b7a70'; x.font = '500 30px Rubik, sans-serif'; x.fillText(E.subtitle + '  ·  ' + E.date, 70, 405);
  let y = 470; const rowH = 122;
  for (const r of board) {
    const t = T[r.team];
    x.fillStyle = '#ffffff'; x.strokeStyle = '#e4e0d4'; x.lineWidth = 2; x.beginPath(); x.roundRect(70, y, W - 140, rowH - 14, 20); x.fill(); x.stroke();
    x.fillStyle = r.rank === 1 ? '#2f8f4e' : '#1d3b2a'; x.font = '900 60px Rubik, sans-serif'; x.textAlign = 'center'; x.fillText(String(r.rank), 135, y + 74);
    const p = PREV[r.team]; if (p) { const d = p - r.rank; x.font = '700 24px Rubik, sans-serif'; x.fillStyle = d > 0 ? '#2f8f4e' : d < 0 ? '#d9534f' : '#6b7a70'; x.fillText(d > 0 ? '▲' + d : d < 0 ? '▼' + (-d) : '=', 135, y + 100); }
    x.textAlign = 'left'; x.fillStyle = '#1d3b2a'; x.font = '700 40px Rubik, sans-serif';
    let name = t.name; while (x.measureText(name).width > 560) name = name.slice(0, -2) + '…';
    x.fillText(name, 200, y + 52);
    x.fillStyle = '#6b7a70'; x.font = 'italic 500 26px Rubik, sans-serif'; x.fillText(t.manager.nick, 200, y + 90);
    x.textAlign = 'right'; x.fillStyle = '#1d3b2a'; x.font = '700 34px Rubik, sans-serif'; x.fillText(rec(t), W - 110, y + 52);
    x.fillStyle = '#6b7a70'; x.font = '500 26px Rubik, sans-serif'; x.fillText((week ? '' : 'proj ') + Math.round(week ? t.record.pf : t.startPts).toLocaleString(), W - 110, y + 90);
    y += rowH;
  }
  x.fillStyle = '#6b7a70'; x.font = '500 26px Rubik, sans-serif'; x.textAlign = 'center'; x.fillText((E.outro || '') + (D.site ? '   ·   ' + D.site : ''), W / 2, H - 60);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
let blob = null;
async function openShare() {
  if (!blob) blob = await drawCard();
  const file = new File([blob], 'gator-tails-power-rankings.png', {type: 'image/png'});
  if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file], title: D.computed.league + ' Power Rankings'}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const url = URL.createObjectURL(blob); document.getElementById('shot').src = url; document.getElementById('dl').href = url; document.getElementById('modal').classList.add('on');
}
document.getElementById('share').onclick = openShare; document.getElementById('share2').onclick = openShare;
document.getElementById('close').onclick = () => document.getElementById('modal').classList.remove('on');
</script>
