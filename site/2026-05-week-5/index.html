.bt{position:relative;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px 8px 8px 34px;min-height:52px;display:flex;flex-direction:column;justify-content:center}
.bt .sd{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:21px;height:21px;border-radius:50%;background:var(--orange);color:#1a0b00;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.bt.bye{border-color:var(--gold);box-shadow:0 0 16px rgba(255,176,46,.25),inset 0 0 0 1px rgba(255,176,46,.2)}.bt.bye .sd{background:var(--gold)}
.bn{font-weight:900;font-size:15px;line-height:1.1;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br{font-size:10.5px;color:var(--mute);margin-top:2px;white-space:nowrap}
.byetag{position:absolute;top:-7px;right:6px;background:var(--gold);color:#1a0b00;font-size:8.5px;font-weight:900;letter-spacing:.12em;padding:2px 6px;border-radius:5px}
.bt.tbd{padding-left:10px;border-style:dashed;border-color:rgba(255,255,255,.18);background:transparent}.bt.tbd .bn{font-size:12px;color:var(--mute);white-space:normal}.bt.tbd .br{font-size:10px;text-transform:uppercase;letter-spacing:.12em}
.pp{font-style:normal;font-size:8.5px;font-weight:900;background:var(--orange);color:#1a0b00;padding:1px 4px;border-radius:4px;margin-left:5px;vertical-align:2px}
.cn{align-self:center;width:2px;height:14px;background:linear-gradient(var(--orange),var(--gold));box-shadow:0 0 8px rgba(255,122,26,.8);position:relative}
.cn.dn::after,.cn.up::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:5px solid transparent}
.cn.dn::after{bottom:-6px;border-top-color:var(--gold)}.cn.up::after{top:-6px;border-bottom-color:var(--orange)}
.ch{position:relative;text-align:center;padding:12px 10px 10px;border-radius:20px;background:radial-gradient(80% 120% at 50% 0%,rgba(255,176,46,.28),rgba(255,122,26,.06) 60%,transparent),#1b122b;border:1.5px solid var(--gold);box-shadow:0 0 30px rgba(255,176,46,.3);overflow:hidden}
.ch::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{to{left:120%}}
.ch-t{font-size:46px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,176,46,.7))}
.ch-l{font-family:"Graduate",var(--font);font-size:22px;color:var(--gold);text-transform:uppercase;margin-top:4px;letter-spacing:.02em}
.ch-w{font-size:10.5px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.rvl{position:relative;margin:24px auto 0;width:min(100%,300px);aspect-ratio:.86}
.wcard{position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,#2a1d40,#170f26);border:2px solid var(--gold);box-shadow:0 0 0 1px rgba(255,176,46,.3),0 0 50px rgba(255,176,46,.35);padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.7)}
.aw.open .wcard{animation:wcin .6s cubic-bezier(.2,.9,.3,1.35) .5s both}
@keyframes wcin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.obj{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center}
.aw.open .obj{pointer-events:none}
.aw.drum .obj{animation:drum .55s linear}
.rv-hint{text-align:center;margin-top:12px;font-size:12px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#ffd9b8;animation:qpulse 1.4s ease-in-out infinite}
.aw.open .rv-hint{visibility:hidden}
.obj .sq{font-family:"Graduate",var(--font);color:#fff;font-size:70px;line-height:1;position:relative;z-index:-1;opacity:.9}
@keyframes gone{to{opacity:0;visibility:hidden}}
/* headstone */
.obj-tomb{align-items:flex-end;overflow:hidden;border-radius:22px}
.stone{position:relative;width:70%;height:76%;margin-bottom:12%;border-radius:120px 120px 10px 10px;background:linear-gradient(160deg,#a3a1ae,#66647a 55%,#45434f);box-shadow:inset -12px -12px 26px rgba(0,0,0,.38),inset 8px 8px 18px rgba(255,255,255,.14),0 18px 34px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.stone::after{content:"";position:absolute;top:18%;right:22%;width:24%;height:30%;border-left:2px solid rgba(30,28,36,.5);border-bottom:2px solid rgba(30,28,36,.45);transform:skewX(-20deg)}
.rip{font-family:"Graduate",var(--font);font-size:30px;color:#2a2833;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.stone .sq{color:#2a2833;z-index:1;text-shadow:0 1px 0 rgba(255,255,255,.3);font-size:76px}
.mound{position:absolute;bottom:3%;left:4%;right:4%;height:20%;border-radius:50% 50% 14px 14px;background:radial-gradient(ellipse at 50% 25%,#5a3a22,#2a1a0e 70%);box-shadow:0 -4px 12px rgba(0,0,0,.4)}
.aw.open .stone{animation:sink 1s cubic-bezier(.5,0,.75,.3) forwards}
@keyframes sink{0%{transform:none}20%{transform:rotate(-5deg)}40%{transform:rotate(4deg) translateY(6px)}100%{transform:rotate(9deg) translateY(140%);opacity:.2}}
.aw.open .mound{animation:gone .5s .7s forwards}
/* pumpkin smash */
.obj-pk{animation:pkglow 1.8s ease-in-out infinite}
@keyframes pkglow{50%{transform:scale(1.05)}}
.obj-pk .h{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:210px;line-height:1;filter:drop-shadow(0 0 34px rgba(255,122,26,.6))}
.obj-pk .l{clip-path:inset(0 50% 0 0)}.obj-pk .r{clip-path:inset(0 0 0 50%)}
.aw.open .obj-pk{animation:none}.aw.open .obj-pk .l{animation:pkl .85s cubic-bezier(.3,0,.7,1) forwards}.aw.open .obj-pk .r{animation:pkr .85s cubic-bezier(.3,0,.7,1) forwards}
@keyframes pkl{30%{transform:translate(-8%,-4%) rotate(-8deg)}to{transform:translate(-75%,60%) rotate(-55deg);opacity:0}}
@keyframes pkr{30%{transform:translate(8%,-4%) rotate(8deg)}to{transform:translate(75%,60%) rotate(55deg);opacity:0}}
/* bats */
.obj-bats{overflow:visible}.obj-bats i{position:absolute;font-style:normal;line-height:1;animation:flap .25s ease-in-out infinite alternate;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
@keyframes flap{to{transform:scaleY(.78) translateY(-3px)}}
.aw.open .obj-bats i{animation:batout .9s cubic-bezier(.4,0,.8,.6) forwards}.aw.open .obj-bats .sq{animation:gone .3s forwards}
@keyframes batout{to{transform:translate(var(--dx),var(--dy)) scale(.35) rotate(var(--r));opacity:0}}
/* coffin */
.cof{position:relative;width:60%;height:96%;perspective:900px}
.cof-body,.cof-lid{position:absolute;inset:0;clip-path:polygon(28% 0,72% 0,100% 23%,82% 100%,18% 100%,0 23%)}
.cof-body{background:radial-gradient(circle at 50% 40%,#2a1a10,#0a0604)}
.cof-lid{background:linear-gradient(160deg,#8a5530,#4e2c16 65%,#3a200f);transform-origin:0 50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cof-lid span{font-size:44px;color:#e8c78a;line-height:1}.cof-lid b{font-family:"Graduate",var(--font);font-weight:400;font-size:62px;color:#f3e1b8;line-height:1}
.aw.open .cof-lid{animation:lid .9s cubic-bezier(.5,0,.6,1) forwards}.aw.open .cof-body{animation:gone .4s .7s forwards}
@keyframes lid{to{transform:rotateY(-120deg) translateX(-10%);opacity:0}}
/* ghost */
.obj-gh .gh{font-size:200px;line-height:1;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 0 34px rgba(255,255,255,.45))}
@keyframes float{50%{transform:translateY(-14px) rotate(-3deg)}}
.aw.open .obj-gh .gh{animation:ghostoff 1s cubic-bezier(.4,0,.8,.5) forwards}
@keyframes ghostoff{30%{transform:scale(1.15)}to{transform:translate(60px,-170%) scale(.5) rotate(20deg);opacity:0}}
/* web */
.obj-web .wb{font-size:250px;line-height:1;opacity:.9;filter:drop-shadow(0 0 20px rgba(255,255,255,.25))}
.obj-web .sp{position:absolute;top:30%;left:58%;font-size:52px;animation:dangle 2s ease-in-out infinite}
.obj-web .sq{position:absolute;z-index:1;font-size:60px}
@keyframes dangle{50%{transform:translateY(16px) rotate(8deg)}}
.aw.open .obj-web .wb{animation:tear .8s ease-in forwards}.aw.open .obj-web .sp{animation:drop .8s ease-in forwards}.aw.open .obj-web .sq{animation:gone .2s forwards}
@keyframes tear{to{transform:scale(1.8) rotate(25deg);opacity:0}}
@keyframes drop{to{transform:translateY(420px) rotate(180deg);opacity:0}}
#phone.theme-sportsbook{color:var(--ink);--bg:#0b0f14;--card:#151b23;--ink:#e8eef5;--mute:#8a96a3;--line:#25303c;--green:#3ddc84;--green2:#12261b;--orange:#ffcc00;--red:#ff5c5c;--gold:#ffcc00;background:var(--bg)}

.fact{margin-top:10px;background:var(--green2);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.4}
.thoughts{margin-top:8px;font-size:14px;line-height:1.5}
.meme{margin-top:10px;position:relative;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--line)}

.meme .tx.top{top:8px}.meme .tx.bot{bottom:8px}
.yt{margin-top:12px;position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#111;border:1px solid var(--line)}

.yt .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(29,59,42,.9);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;padding-left:5px;box-shadow:0 4px 16px rgba(0,0,0,.4)}

.cdn{display:flex;justify-content:center;gap:10px}

.cdn i{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;color:#cfe9b0;font-style:normal}
.cdl{font-size:12px;color:#cfe9b0;margin-top:10px}
.cap{font-size:12px;color:var(--mute);margin-top:6px;font-style:italic;text-align:center}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-family:var(--font);font-size:16px;font-weight:900;letter-spacing:.02em;cursor:pointer;position:relative;z-index:30}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:8px;font-weight:700}
#modal{position:absolute;inset:0;z-index:50;background:rgba(29,59,42,.92);display:none;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));overflow:auto}
#modal.on{display:flex}
#modal img{width:100%;border-radius:14px;display:block}
#modal .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;font-size:26px;color:#fff;background:none;border:0;cursor:pointer;font-weight:700}
.small{font-size:12px;color:#dfe8e0;text-align:center;margin:10px 0}
.foot{font-size:11px;color:var(--mute);text-align:center;margin-top:12px}
@media (max-height:720px){.thoughts{font-size:13px}h1{font-size:38px}}

#phone.theme-cyber .btn{background:var(--green);color:#03131a;font-family:var(--hf);text-transform:uppercase;letter-spacing:.08em;box-shadow:0 0 22px rgba(0,240,255,.4)}#phone.theme-cyber .btn.alt{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}

#phone.theme-cyber .dy-row.me{background:#2a1040}#phone.theme-cyber .chip{background:#1c1738;color:var(--ink)}#phone.theme-cyber .chip.dn{background:#3a1226;color:#ff9bb0}#phone.theme-cyber .chip.now{background:var(--green);color:#03131a}

#phone.theme-cyber .take{background:var(--card)}#phone.theme-cyber .take b{color:var(--gold)}
#phone.theme-cyber .win{background:radial-gradient(80% 50% at 50% 34%,rgba(255,43,214,.35),transparent 70%),var(--bg)}
#phone.theme-cyber .bigpts{font-family:var(--hf);font-size:72px;color:var(--gold);text-shadow:0 0 26px rgba(252,238,10,.55)}
#phone.theme-cyber .sh{background:var(--card)}#phone.theme-cyber .flag,#phone.theme-cyber .flagbig{color:#fff;box-shadow:0 0 18px rgba(255,43,214,.55)}

#phone.theme-cyber .dow-t{color:var(--green);text-shadow:0 0 22px rgba(0,240,255,.45);font-size:36px}
#phone.theme-cyber .pslip{background:linear-gradient(170deg,#1a1436,#0d0a1c);border-top-color:var(--green);box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 40px rgba(0,240,255,.14)}

@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.55}}
.cv-city{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:0;opacity:.9;pointer-events:none}
.cv-rain,.st-rain{position:absolute;inset:-20% 0 0 0;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 13px,rgba(160,220,255,.16) 13px 14px,transparent 14px 31px);background-size:62px 220px;animation:rainfall .55s linear infinite;opacity:.55}
@keyframes rainfall{to{background-position:-38px 220px}}
#phone.theme-cyber .slide.cover>*:not(.cv-city):not(.cv-rain){position:relative;z-index:2}
.sndbtn{display:inline-flex;align-items:center;gap:8px;margin:16px auto 0;padding:11px 18px;border-radius:999px;border:1.5px solid var(--green);background:rgba(0,240,255,.08);color:var(--green);font-family:var(--mf);font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 18px rgba(0,240,255,.3);position:relative;z-index:30}

#phone.theme-cyber .slide.cover .gator{transform-origin:50% 100%;animation:gdance .909s cubic-bezier(.3,.7,.4,1) infinite}

#mus{position:absolute;right:12px;top:calc(22px + env(safe-area-inset-top));z-index:40;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(0,240,255,.55);background:rgba(7,6,15,.7);color:#00f0ff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#mus i{display:flex;gap:2px;align-items:flex-end;height:13px}#mus i b{width:3px;background:currentColor;height:4px;border-radius:1px}
#mus.on i b{animation:eq .7s ease-in-out infinite alternate}#mus.on i b:nth-child(2){animation-delay:.2s}#mus.on i b:nth-child(3){animation-delay:.4s}

/* character idle animation */

[data-gch] .swing{animation:swing 2.6s ease-in-out infinite alternate}@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
[data-gch] .rock{transform-box:fill-box;transform-origin:50% 50%;animation:rock 2.2s ease-in-out infinite alternate}@keyframes rock{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-3px)}}

[data-gch] .swirl{animation:swirl 1.8s ease-in-out infinite alternate}@keyframes swirl{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}

[data-gch] .visor{animation:visor 2.4s ease-in-out infinite alternate}@keyframes visor{from{fill:#00f0ff}to{fill:#ff2bd6}}
[data-gch] .flex{transform-box:fill-box;transform-origin:50% 100%;animation:flexx 1.2s ease-in-out infinite alternate}@keyframes flexx{from{transform:scale(1)}to{transform:scale(1.12)}}
[data-gch] .snow circle{animation:snow 3s linear infinite}[data-gch] .snow circle:nth-child(2n){animation-duration:4.2s;animation-delay:-1.5s}[data-gch] .snow circle:nth-child(3n){animation-duration:3.6s;animation-delay:-2.2s}@keyframes snow{from{transform:translate(0,-60px)}to{transform:translate(-18px,330px)}}

/* ---- story slide ---- */
.slide.story{padding:0;overflow:hidden;--p:0;background:#07060f!important}
.slide.story>*{animation:none}
.st-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.st-bg::before,.st-bg::after{content:"";position:absolute;inset:0}
.st-bg::before{background:radial-gradient(90% 50% at 50% 100%,#0e3b2a,transparent 70%),linear-gradient(#050a0c,#07140f);opacity:calc(1 - var(--p))}
.st-bg::after{background:radial-gradient(90% 55% at 50% 0%,#ff2bd6 0%,rgba(255,43,214,0) 60%),radial-gradient(70% 40% at 80% 20%,rgba(252,238,10,.35),transparent 70%),linear-gradient(#1a0b3a,#0a0618);opacity:var(--p)}
.st-city{position:absolute;left:-4%;right:-4%;bottom:0;height:62%;transform:translateY(calc(var(--p) * 62%));transition:transform .5s ease-out;z-index:1;opacity:.85}
.st-city2{position:absolute;left:0;right:0;bottom:0;height:34%;transform:translateY(calc(var(--p) * 30%));transition:transform .5s ease-out;z-index:1;opacity:.5;filter:hue-rotate(60deg)}
.st-moon{position:absolute;right:26px;top:calc(120px - var(--p) * 60px);width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffd6f6 60%,#ff8be6);box-shadow:0 0 50px rgba(255,140,230,.7);opacity:calc(var(--p) * var(--p));z-index:0}
.st-rain{z-index:2;opacity:calc(.6 - var(--p) * .35)}
.st-shade{position:absolute;inset:0;z-index:3;background:linear-gradient(rgba(7,6,15,.3),rgba(7,6,15,.6))}
.st-hud{position:absolute;left:14px;top:calc(24px + env(safe-area-inset-top));z-index:12;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.16em;color:#9089bd;text-transform:uppercase;display:flex;gap:10px;align-items:center;pointer-events:none}
.st-hud b{color:var(--ac,#00f0ff);font-weight:400;transition:color .3s}
.st-shaft{position:absolute;right:6px;top:calc(70px + env(safe-area-inset-top));bottom:calc(26px + env(safe-area-inset-bottom));width:16px;z-index:12;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.st-shaft::before{content:"";position:absolute;top:6px;bottom:6px;left:50%;width:1px;background:rgba(255,255,255,.16)}

.st-shaft i.cur{width:16px;height:16px;border-radius:4px;background:var(--ac,#00f0ff);box-shadow:0 0 14px var(--ac,#00f0ff)}
.st-shaft i.cur::after{content:attr(data-r);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 9px 'Orbitron',sans-serif;color:#05040c}
.st-scroll{position:absolute;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity;touch-action:pan-y;scrollbar-width:none}
.st-scroll::-webkit-scrollbar{display:none}
.sc{position:relative;min-height:100%;scroll-snap-align:start;padding:calc(58px + env(safe-area-inset-top)) 30px calc(22px + env(safe-area-inset-bottom)) 18px;display:flex;flex-direction:column;--ac:#00f0ff}
.sc .rv{opacity:0;transform:translateY(16px);transition:opacity .5s ease-out,transform .5s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.sc.in .rv{opacity:1;transform:none}
.sc-floor{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);display:flex;align-items:center;gap:8px}

.sc-top{display:flex;align-items:center;gap:12px;margin-top:8px}
.sc-rank{font-family:'Orbitron',sans-serif;font-weight:900;font-size:76px;line-height:.9;color:transparent;-webkit-text-stroke:2px var(--ac);text-shadow:0 0 26px var(--ac);letter-spacing:-.04em;flex:none}

.sc.in .sc-rank{animation:rankin .7s cubic-bezier(.2,.9,.3,1.3) both,rankglow 2.4s ease-in-out .7s infinite alternate}
@keyframes rankin{from{opacity:0;transform:scale(2.2) rotate(-6deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes rankglow{from{text-shadow:0 0 14px var(--ac)}to{text-shadow:0 0 34px var(--ac),0 0 60px var(--ac)}}
.sc-who{min-width:0}
.sc-nm{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;line-height:1.05;text-transform:uppercase;color:#fff;overflow-wrap:anywhere}
.sc-tm{font-size:12px;color:#9089bd;margin-top:3px;font-style:italic}
.sc-rec{font-family:'Share Tech Mono',monospace;font-size:13px;color:#ece9ff;margin-top:4px;letter-spacing:.06em}
.sc-rec .mv{font-size:12px;margin-left:6px}
.sc-rec .flag{font-family:var(--font)}
